name: my_wallet_ai
description: Flutter finance tracker with AI receipts, budgets and subscription calendar
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  image_picker: ^1.2.1
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-NotoSansThai.txt
    - assets/fonts/OFL-Nunito.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 400
        - asset: assets/fonts/Nunito.ttf
          weight: 600
        - asset: assets/fonts/Nunito.ttf
          weight: 700
        - asset: assets/fonts/Nunito.ttf
          weight: 800
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
          weight: 400
        - asset: assets/fonts/NotoSansThai.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai.ttf
          weight: 700
